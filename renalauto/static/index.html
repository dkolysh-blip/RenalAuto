<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RenalAuto</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb;
          --ok:#15803d; --warn:#b45309; --danger:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#e6e8eb; --muted:#9aa3ae; --line:#2a2f37; --accent:#60a5fa;
            --ok:#4ade80; --warn:#fbbf24; --danger:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); display:inline-block; }
  .dot.live { background:var(--ok); }
  main { display:grid; grid-template-columns: minmax(0,1fr) 380px; gap:16px; padding:16px; max-width:1400px; margin:0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0,1fr); } }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  h2 { font-size:15px; margin:0 0 10px; }
  form { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  input, select, button { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); min-width:0; }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  .feed { display:flex; flex-direction:column; gap:8px; }
  .item { display:grid; grid-template-columns: 120px minmax(0,1fr); gap:10px; border:1px solid var(--line); border-radius:8px; padding:8px; }
  .item.fresh { border-color:var(--accent); }
  .item img { width:120px; height:80px; object-fit:cover; border-radius:6px; background:var(--line); }
  .item a { color:var(--text); font-weight:600; text-decoration:none; }
  .meta { color:var(--muted); font-size:13px; }
  .tag { font-size:11px; padding:1px 6px; border-radius:10px; border:1px solid var(--line); margin-right:4px; }
  .price { font-weight:600; }
  .link { background:none; color:var(--accent); padding:0; border:0; font-size:13px; }
  .verdict-ok { color:var(--ok); } .verdict-warning { color:var(--warn); } .verdict-danger { color:var(--danger); }
  .check { margin:4px 0; padding-left:8px; border-left:3px solid var(--line); }
  .check.warning { border-color:var(--warn); } .check.danger { border-color:var(--danger); } .check.info { border-color:var(--ok); }
  pre { white-space:pre-wrap; word-break:break-word; font-size:12px; }
  code { word-break:break-all; }
</style>
</head>
<body>
<header>
  <h1>RenalAuto</h1>
  <span><span class="dot" id="dot"></span> <span id="status" class="meta">подключение…</span></span>
</header>
<main>
  <section>
    <h2>Объявления (в реальном времени)</h2>
    <form id="filters">
      <select name="country"><option value="">KR + CN</option><option value="KR">Корея</option><option value="CN">Китай</option></select>
      <input name="make" placeholder="Марка (Hyundai / 현대 / 比亚迪)" size="18">
      <input name="model" placeholder="Модель" size="10">
      <input name="year_from" type="number" placeholder="Год от" style="width:90px">
      <input name="mileage_max" type="number" placeholder="Пробег до, км" style="width:120px">
      <input name="price_usd_max" type="number" placeholder="Цена до, $" style="width:110px">
      <button>Применить</button>
    </form>
    <div class="feed" id="feed"></div>
  </section>
  <aside>
    <section>
      <h2>Проверка по VIN</h2>
      <form id="vinform"><input name="vin" placeholder="17 символов" maxlength="25" style="flex:1"><button>Проверить</button></form>
      <div id="report" class="meta">Введите VIN или нажмите «Проверить VIN» у объявления.</div>
    </section>
  </aside>
</main>
<script>
const feed = document.getElementById('feed');
const fmt = n => n == null ? '—' : Math.round(n).toLocaleString('ru-RU');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let es;

function card(l, fresh, note) {
  const el = document.createElement('div');
  el.className = 'item' + (fresh ? ' fresh' : '');
  el.innerHTML = `
    ${l.photo ? `<img loading="lazy" src="${esc(l.photo)}" alt="">` : '<img alt="">'}
    <div>
      <div><span class="tag">${esc(l.source)}</span>${note ? `<span class="tag">${esc(note)}</span>` : ''}
        <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a></div>
      <div class="meta">${l.year ?? ''} · ${fmt(l.mileage_km)} км · ${esc(l.location ?? '')}</div>
      <div><span class="price">${fmt(l.price)} ${esc(l.currency)}</span> <span class="meta">~$${fmt(l.price_usd)}</span></div>
      <div class="meta">${l.vin ? `VIN <code>${esc(l.vin)}</code> · ` : ''}
        <button class="link" data-src="${esc(l.source)}" data-id="${esc(l.external_id)}">Проверить VIN</button></div>
    </div>`;
  return el;
}

function params() {
  const p = new URLSearchParams();
  for (const [k, v] of new FormData(document.getElementById('filters'))) if (v) p.set(k, v);
  return p;
}

async function load() {
  const p = params();
  const res = await fetch('/api/listings?limit=50&' + p);
  feed.replaceChildren(...(await res.json()).map(l => card(l, false)));
  if (es) es.close();
  const sp = new URLSearchParams(p);
  es = new EventSource('/api/stream?' + sp);
  es.onopen = () => { dot.className = 'dot live'; statusEl.textContent = 'поток подключён'; };
  es.onerror = () => { dot.className = 'dot'; statusEl.textContent = 'переподключение…'; };
  for (const type of ['new', 'price_changed']) {
    es.addEventListener(type, e => {
      const ev = JSON.parse(e.data);
      const note = type === 'new' ? 'новое' : `цена было ${fmt(ev.old_price)}`;
      feed.prepend(card(ev.listing, true, note));
      while (feed.children.length > 300) feed.lastChild.remove();
    });
  }
}

function renderReport(r) {
  const d = r.decoded;
  const checks = r.checks.map(c => `<div class="check ${c.severity}">${esc(c.detail)}</div>`).join('');
  const labels = {ok: 'Явных проблем не найдено', warning: 'Есть замечания', danger: 'Есть серьёзные проблемы'};
  return `<div class="verdict-${r.verdict}"><b>${labels[r.verdict]}</b></div>
    <div><code>${esc(r.vin)}</code></div>
    <div class="meta">${esc(d.country ?? '—')} · ${esc(d.manufacturer ?? 'производитель не определён')} · модельный год ${d.model_year ?? '—'}</div>
    ${checks}
    ${r.history ? `<h2 style="margin-top:10px">История (${esc(r.history.source)})</h2>
      <div class="meta">ДТП: свои ${r.history.accidents_own}, чужие ${r.history.accidents_other} · владельцев сменилось ${r.history.owner_changes}</div>` : ''}
    ${r.external.nhtsa ? `<h2 style="margin-top:10px">NHTSA</h2><pre>${esc(JSON.stringify(r.external.nhtsa, null, 1))}</pre>` : ''}
    ${r.listings.length ? `<div class="meta">Объявлений с этим VIN: ${r.listings.length}</div>` : ''}`;
}

async function showReport(url) {
  const box = document.getElementById('report');
  box.textContent = 'Проверяем…';
  const res = await fetch(url);
  const body = await res.json();
  box.innerHTML = res.ok ? renderReport(body) : `<span class="verdict-danger">${esc(body.detail)}</span>`;
}

document.getElementById('filters').onsubmit = e => { e.preventDefault(); load(); };
document.getElementById('vinform').onsubmit = e => {
  e.preventDefault();
  const vin = new FormData(e.target).get('vin').trim();
  if (vin) showReport('/api/vin/' + encodeURIComponent(vin));
};
feed.addEventListener('click', e => {
  const b = e.target.closest('button[data-src]');
  if (b) showReport(`/api/listings/${encodeURIComponent(b.dataset.src)}/${encodeURIComponent(b.dataset.id)}/vin-report`);
});
const dot = document.getElementById('dot'), statusEl = document.getElementById('status');
load();
</script>
</body>
</html>
