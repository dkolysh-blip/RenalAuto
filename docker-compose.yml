services:
  renalauto:
    build: .
    env_file: .env
    # Наружу сервис доступен только через Caddy (HTTPS); порт 8000 — лишь для локальных проверок
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    env_file: .env
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - renalauto
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
