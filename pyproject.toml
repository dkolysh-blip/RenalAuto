[project]
name = "renalauto"
version = "0.1.0"
description = "Объявления с вторичного авторынка Кореи и Китая в реальном времени + проверка по VIN"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["renalauto*"]

[tool.setuptools.package-data]
renalauto = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
